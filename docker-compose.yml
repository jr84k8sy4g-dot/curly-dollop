services:
  app:
    build: .
    image: cdss-dosage:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cdss:cdss@db:5432/cdss
      REDIS_URL: redis://cache:6379
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdss
      POSTGRES_PASSWORD: cdss
      POSTGRES_DB: cdss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./db/seeds/001_role_permissions.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
      - ./db/seeds/002_drug_categories.sql:/docker-entrypoint-initdb.d/02_categories.sql:ro
      - ./db/seeds/003_drugs.sql:/docker-entrypoint-initdb.d/03_drugs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdss -d cdss"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
